<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milk Tea POS</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800">

  <!-- Header: shop name, live transaction reference, always-available New Transaction -->
  <header class="bg-amber-900 text-amber-50 px-4 py-3 sm:px-6 sm:py-4 flex flex-wrap items-center justify-between gap-2">
    <h1 class="text-lg sm:text-xl font-bold tracking-wide">🧋 Milk Tea POS</h1>
    <div class="flex items-center gap-2 sm:gap-3">
      <span id="txn-label" class="text-xs sm:text-sm text-amber-200">Transaction: TXN-0001</span>
      <button
        id="header-new-txn-btn"
        class="h-9 px-3 rounded-lg border border-amber-200/60 text-xs sm:text-sm font-semibold hover:bg-amber-800 active:bg-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-200">
        New Transaction
      </button>
    </div>
  </header>

  <!-- Main: mobile-first — one column on phones, two on md, three on lg.
       Desktop: products take 2/3 (col-span-2) and the checkout panel takes 1/3. -->
  <main class="grid grid-cols-1 gap-4 p-3 sm:p-4 md:grid-cols-2 lg:grid-cols-3">

    <!-- ============ Products (2/3 on desktop) ============ -->
    <section class="bg-white rounded-xl shadow p-4 lg:col-span-2">
      <h2 class="text-lg font-bold mb-3 border-b border-amber-200 pb-2 text-amber-900">Products</h2>
      <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 2xl:grid-cols-3 gap-3">
        <!-- Product cards rendered by app.js -->
      </div>
    </section>

    <!-- ============ Checkout panel (1/3): Order Summary + Payment ============ -->
    <aside class="md:sticky md:top-4 md:self-start flex flex-col gap-4">

      <!-- Order Summary -->
      <section id="cart-section" class="bg-white rounded-xl shadow p-4">
        <div class="flex items-center justify-between border-b border-amber-200 pb-2 mb-3">
          <h2 class="text-lg font-bold text-amber-900">Order Summary</h2>
          <button
            id="clear-cart-btn"
            disabled
            title="Clear Cart"
            class="px-2 text-xs font-semibold text-red-700 hover:underline rounded cursor-pointer disabled:text-slate-300 disabled:no-underline disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-red-300">
            Clear Cart
          </button>
        </div>
        <!-- Empty-cart state with a friendly illustration -->
        <div id="cart-empty-msg" class="text-center py-6 text-slate-400">
          <div class="text-4xl mb-2" aria-hidden="true">🧋</div>
          <p class="text-sm">Your cart is empty — add a drink to start.</p>
        </div>
        <div id="cart-list" class="space-y-2 hidden">
          <!-- Cart rows rendered by app.js -->
        </div>
        <div class="pt-3 mt-3 border-t border-amber-200 flex justify-between items-baseline">
          <span class="font-bold">Total:</span>
          <span id="cart-total" class="text-xl font-extrabold text-amber-900">₱0.00</span>
        </div>
      </section>

      <!-- Payment -->
      <section id="payment-section" class="bg-white rounded-xl shadow p-4">
        <h2 class="text-lg font-bold mb-3 border-b border-amber-200 pb-2 text-amber-900">Payment</h2>

        <!-- Status messages -->
        <div id="payment-error" class="hidden bg-red-100 text-red-700 rounded-lg p-3 mb-2 text-sm" role="alert"></div>
        <div id="payment-success" class="hidden bg-green-100 text-green-800 rounded-lg p-3 mb-2 text-sm font-medium" role="status"></div>

        <label class="block text-sm font-medium mb-1" for="cash-input">Cash received (₱)</label>
        <input
          id="cash-input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="0.00"
          class="w-full text-base border border-slate-300 rounded-lg p-3 mb-2 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-amber-600" />

        <div id="change-preview" class="text-sm text-slate-500 mb-2">
          Change: ₱0.00
        </div>

        <button
          id="pay-btn"
          class="w-full h-11 bg-amber-700 text-amber-50 rounded-lg font-bold hover:bg-amber-800 active:bg-amber-900 disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-amber-700 focus:ring-offset-2">
          Pay
        </button>
      </section>

    </aside>
  </main>

  <!-- ============ Reusable modal component ============ -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/50"></div>
    <div
      id="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl outline-none">
      <!-- Card SIZING (fixed width for dialogs vs shrink-wrap for images) is
           applied dynamically by openModal in app.js -->
      <div class="flex items-start justify-between gap-3">
        <h3 id="modal-title" class="text-lg font-bold text-amber-900"></h3>
        <button
          id="modal-close"
          aria-label="Close dialog"
          class="text-2xl leading-none px-2 rounded text-slate-400 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400">&times;</button>
      </div>
      <div id="modal-body" class="mt-3 text-sm text-slate-700 space-y-2"></div>
      <div id="modal-actions" class="mt-5 flex flex-wrap justify-end gap-2"></div>
    </div>
  </div>

  <!-- ============ Toast notifications ============ -->
  <div id="toast-root" class="fixed bottom-4 inset-x-0 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
